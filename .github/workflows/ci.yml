name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The suite finishes in seconds. A hung fixture pipeline once burned
    # the full 6h Actions default on macOS and read as `cancelled`, not as a
    # failure — see docs/testing.md. Fail fast instead (10 min = pure slack).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `shell: bash` = Git Bash on the Windows runner — the exact path
      # shell-form hooks take on real Windows machines (ADR 0002).
      - name: test matrix
        shell: bash
        run: sh test/test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck hooks/flint-style.sh install.sh test/test.sh test/tokscan_test.sh
